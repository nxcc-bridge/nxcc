apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nxcc.fullname" . }}-worker
  labels:
    {{- include "nxcc.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "nxcc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        {{- include "nxcc.confidentialAnnotations" . | nindent 8 }}
      labels:
        {{- include "nxcc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: nxcc-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.worker.httpPort }}
              protocol: TCP
            - name: p2p
              containerPort: {{ .Values.worker.p2pPort }}
              protocol: TCP
          env:
            # The worker also uses the internal seed service to bootstrap into the p2p network.
            - name: NXCC_NETWORK_BOOTSTRAP_PEERS
              value: "/dns4/{{ include "nxcc.fullname" . }}-seed-bootstrap.{{ .Release.Namespace }}.svc.cluster.local/tcp/{{ .Values.seed.p2pPort }}"
            # Set listen addresses based on Dockerfile/config defaults.
            - name: NXCC_NETWORK_LISTEN_ADDRESSES
              value: "/ip4/0.0.0.0/tcp/{{ .Values.worker.p2pPort }}"
            - name: NXCC_HTTP_LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.worker.httpPort }}"
            {{- include "nxcc.operatorKeyEnvVars" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            {{- include "nxcc.operatorKeyVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "nxcc.operatorKeyVolumes" . | nindent 8 }}
