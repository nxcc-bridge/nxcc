{{- if and .Values.nodeVariant .Values.variantRouting.enabled .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nxcc.fullname" . }}-{{ .Values.nodeVariant }}-worker
  labels:
    {{- include "nxcc.labels" . | nindent 4 }}
    app.kubernetes.io/variant: {{ .Values.nodeVariant }}
    app.kubernetes.io/component: worker
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: {{ $.Values.variantRouting.pathPrefix }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "nxcc.fullname" $ }}-worker
                port:
                  name: http
    {{- end }}
---
{{- if gt (int .Values.seed.replicaCount) 0 }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nxcc.fullname" . }}-{{ .Values.nodeVariant }}-seed
  labels:
    {{- include "nxcc.labels" . | nindent 4 }}
    app.kubernetes.io/variant: {{ .Values.nodeVariant }}
    app.kubernetes.io/component: seed
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: {{ $.Values.variantRouting.pathPrefix }}/seed
            pathType: Prefix
            backend:
              service:
                name: {{ include "nxcc.fullname" $ }}-seed-http
                port:
                  name: http
    {{- end }}
{{- end }}
{{- end }}