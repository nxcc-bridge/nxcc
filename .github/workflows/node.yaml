name: Node Checks

on:
  push:
    branches:
      - main
    paths:
      - "node/**"
      - ".github/workflows/node.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "node/**"
      - ".github/workflows/node.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dev-container:
    name: Build Dev Container
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev container
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./dev
          tags: nxcc-dev:${{ github.sha }}
          outputs: type=docker,dest=/tmp/nxcc-dev.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload dev container
        uses: actions/upload-artifact@v4
        with:
          name: nxcc-dev-container
          path: /tmp/nxcc-dev.tar
          retention-days: 1

  node-checks:
    name: Node Lint and Test
    runs-on: ubuntu-latest
    needs: build-dev-container

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download dev container
        uses: actions/download-artifact@v4
        with:
          name: nxcc-dev-container
          path: /tmp

      - name: Load dev container
        run: docker load -i /tmp/nxcc-dev.tar

      - name: Run tests in dev container
        run: |
          # Fix permissions for the dev user in container
          sudo chown -R 1000:1000 .
          
          # Run the lint and test commands in the exact container built above
          docker run --rm -v $PWD:/workspace -w /workspace nxcc-dev:${{ github.sha }} /bin/bash -c "
            cd node
            rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rustfmt
            cargo +nightly fmt --check
            cargo clippy --locked --all-features --profile test -- -D warnings -D clippy::dbg_macro  
            cargo test --all-features
          "