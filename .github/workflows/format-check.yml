name: Documentation and YAML Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "**/README.md"
      - ".github/workflows/*.yml"

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tools
        run: |
          npm install -g markdown-link-check prettier

      - name: Check README formatting
        run: |
          git ls-files '**/README.md' | \
          xargs -I {} prettier --check {} --config .github/workflows/.prettierrc.json

      - name: Check YAML formatting
        run: |
          prettier --check ".github/workflows/*.yml" \
            --config .github/workflows/.prettierrc.json

      - name: Check links in all Markdown files
        run: |
          find . -name "README.md" -not -path "./node_modules/*" -not -path "./.git/*" | \
          xargs -I {} markdown-link-check {} --config .github/workflows/.markdown-link-check.json
