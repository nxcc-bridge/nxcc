name: End-to-End Tests

on:
  workflow_run:
    workflows: ["Build and Publish Node Docker Image"]
    types:
      - completed
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use minimal resource requests for GitHub Actions environment
  E2E_MINIMAL_RESOURCES: "true"
  # GitHub Actions timeout (slightly less than job timeout)
  E2E_TOTAL_TIMEOUT: "3000" # 50 minutes

jobs:
  e2e-tests:
    name: Run KinD E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 55
    # Only run if docker build was successful (or on PR/manual trigger)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # Install kind
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

          # Install kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

          # Install helm
          curl https://get.helm.sh/helm-v3.12.3-linux-amd64.tar.gz | tar -xzO linux-amd64/helm > helm
          chmod +x helm
          sudo mv helm /usr/local/bin/helm

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Run E2E tests
        env:
          # Pass pre-built image info for CI optimization (use short SHA to match build workflow)
          E2E_PREBUILT_IMAGE: ghcr.io/${{ github.repository_owner }}/node:${{ steps.sha.outputs.short }}
          E2E_CI_MODE: "true"
        run: |
          cd e2e
          ./e2e_test.sh --verbose --debug
