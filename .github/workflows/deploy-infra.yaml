name: Deploy Infrastructure

# Trigger this workflow when the Docker build workflow completes successfully
on:
  workflow_run:
    workflows: ["Build and Publish Node Docker Image"]
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

# Environment variables used across jobs
env:
  # Configuration flags
  ENABLE_GKE_STAGING: false # Set to false to disable GKE staging deployments

  # GCP Configuration (matches infra.sh defaults)
  GCP_LOCATION: europe
  GCP_GKE_REGION: europe-west4
  GKE_CLUSTER_NAME: nxcc
  AR_REPO_NAME: nxcc-images
  AR_IMAGE_NAME: node

  # Helm Configuration
  HELM_CHART_PATH: ./charts/nxcc-node


jobs:
  # --- Deploy to Staging (GKE) ---
  # Runs only when the triggering workflow was for the 'main' branch and succeeded
  deploy-staging:
    name: Deploy to GKE (Staging)
    runs-on: ubuntu-latest
    # Only run if the build was successful AND it was on the main branch
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    # Permissions needed for GCP authentication
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Make script executable
        run: chmod +x ./infra/infra.sh

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      # --- GKE (Staging) Deployment ---

      - name: Authenticate with Google Cloud
        if: env.ENABLE_GKE_STAGING == 'true'
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up GKE credentials
        if: env.ENABLE_GKE_STAGING == 'true'
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER_NAME }}
          location: ${{ env.GCP_GKE_REGION }}

      - name: Deploy to GKE (Staging)
        if: env.ENABLE_GKE_STAGING == 'true'
        env:
          # The build workflow pushes 'latest' on main branch pushes
          IMAGE_TAG_OVERRIDE: latest
          CI: true # Enable non-interactive mode in the script
        run: ./infra/infra.sh k8s deploy staging

  # --- Deploy to Production (GKE) ---
  # Runs only when the triggering workflow was for a release tag (e.g., v1.0.0) and succeeded
  deploy-production:
    name: Deploy to GKE (Production)
    runs-on: ubuntu-latest
    # Only run if the build was successful AND it was triggered by a tag starting with 'v'
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')

    # Permissions needed for GCP authentication
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Make script executable
        run: chmod +x ./infra/infra.sh

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Authenticate with Google Cloud
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER_NAME }}
          location: ${{ env.GCP_GKE_REGION }}

      - name: Deploy to GKE (Production)
        env:
          # The tag name is stored in head_branch for tag events
          IMAGE_TAG_OVERRIDE: ${{ github.event.workflow_run.head_branch }}
          CI: true # Enable non-interactive mode in the script
        run: ./infra/infra.sh k8s deploy prod
