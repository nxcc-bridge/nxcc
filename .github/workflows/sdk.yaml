name: SDK Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-checks:
    name: SDK Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install workspace dependencies
        working-directory: sdk
        run: pnpm install

      - name: Build SDK (dependency first)
        working-directory: sdk/lib
        run: pnpm build

      - name: Build CLI
        working-directory: sdk/cli
        run: pnpm build

      - name: Lint CLI
        working-directory: sdk/cli
        run: pnpm lint

      - name: Lint SDK
        working-directory: sdk/lib
        run: pnpm lint

      - name: Test CLI
        working-directory: sdk/cli
        run: pnpm test

      - name: Test SDK
        working-directory: sdk/lib
        run: pnpm test
