name: README Format Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "**/README.md"

jobs:
  readme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tools
        run: |
          npm install -g markdown-link-check prettier@3.2.4

      - name: Check README formatting
        run: |
          .github/workflows/format-readme.sh check

      - name: Check links in all Markdown files
        run: |
          find . -name "README.md" -not -path "./node_modules/*" -not -path "./.git/*" | \
          xargs -I {} markdown-link-check {} --config .github/workflows/.markdown-link-check.json
