[package]
name = "benchmarks"
version = "0.1.0"
edition = "2021"

[dependencies]
nxcc-interface = { path = "../node/interface" }
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.13.1", features = ["transport", "codegen"] }
prost = "0.13.5"
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7.5"
indicatif = "0.17"
serde_json = "1.0"
base64 = "0.22.1"
anyhow = "1.0"
futures = "0.3"
alloy-primitives = "1.0.0"
alloy-sol-types = { version = "1.2.0", features = ["json"] }
alloy-provider = { version = "1.0.6", features = ["ws", "pubsub", "reqwest", "reqwest-rustls-tls"] }
alloy-rpc-types = "1.0.6"
alloy-contract = "1.0.6"
url = "2.5"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9.1"
hex = { version = "0.4.3", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
alloy-signer-local = "1.0.19"

[profile.release]
codegen-units = 1
lto = "thin"
