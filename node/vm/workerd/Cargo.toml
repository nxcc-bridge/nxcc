[package]
name = "nxcc-workerd-vm"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nxcc-workerd-vm"
path = "src/main.rs"

[dependencies]
nxcc-vm-base = { path = "../base" }
nxcc-interface = { path = "../../interface" }

# Async runtime and utilities
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "process", "fs", "net", "time", "sync", "io-util"] }
tokio-stream = "0.1.18"
async-trait = "0.1.89"
futures = "0.3.31"
tonic = "0.14.2"

# Cap'n Proto
capnp = "0.25.0"
capnp-rpc = "0.25.0" # Needed for canonicalization helper

# Hashing
sha2 = "0.10.9"
hex = "0.4.3"

# HTTP Client for UDS
hyper = { version = "1.8.1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "http1"] } # For hyper 1.x
hyper-unix-connector = "0.2.2" # For hyper 0.14.x

# Serialization/Deserialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

thiserror = "2.0.18"

# Logging/Tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# Other utilities
rand = "0.9.2"
tempfile = "3.24.0"
once_cell = "1.21.3"
bytes = "1.11.0"
http-body = "1.0.1"
hyperlocal = "0.9.1"
http-body-util = "0.1.3"
nix = { version = "0.31.1", features = ["signal"] }
clap = { version = "4.5.54", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
dashmap = "6.1.0"

[build-dependencies]
capnpc = "0.25.0"

[features]
default = ["nxcc-vm-base/uds"]
uds = ["nxcc-vm-base/uds"]
vsock = ["nxcc-vm-base/vsock"]
tcp = ["nxcc-vm-base/tcp"]

[dev-dependencies]
base64 = "0.22.1"
hkdf = "0.12.4"
hmac = "0.12.1"
sha2 = "0.10.9"
tracing-test = "0.2.5"
tokio-stream = "0.1.18"
rustls = { version = "0.23", features = ["aws_lc_rs"] }
