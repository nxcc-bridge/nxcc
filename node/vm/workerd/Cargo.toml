[package]
name = "nxcc-workerd-vm"
version = "0.1.0"
edition = "2024"

[dependencies]
nxcc-vm-base = { path = "../base" }
nxcc-interface = { path = "../../interface" }

# Async runtime and utilities
tokio = { version = "1.44.1", features = ["rt-multi-thread", "macros", "process", "fs", "net", "time", "sync", "io-util"] }
async-trait = "0.1.83"
futures = "0.3.30"

# Cap'n Proto
capnp = "0.21.0"
capnp-rpc = "0.21.0" # Needed for canonicalization helper

# Hashing
sha2 = "0.10.8"
hex = "0.4.3"

# HTTP Client for UDS
hyper = { version = "1.6.0", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "http1"] } # For hyper 1.x
hyper-unix-connector = "0.2.2" # For hyper 0.14.x

# Serialization/Deserialization
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.128"

thiserror = "2.0.12"

# Logging/Tracing
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

# Other utilities
rand = "0.9.1"
tempfile = "3.10.1"
once_cell = "1.19.0"
bytes = "1.6.1"
uuid = { version = "1.16.0", features = ["v4"] }
http-body = "1.0.1"
hyperlocal = "0.9.1"
http-body-util = "0.1.3"
nix = { version = "0.29.0", features = ["signal"] }
clap = { version = "4.5.37", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "env"] }

[build-dependencies]
capnpc = "0.21.0"

[features]
default = ["nxcc-vm-base/uds"]
uds = ["nxcc-vm-base/uds"]
vsock = ["nxcc-vm-base/vsock"]
tcp = ["nxcc-vm-base/tcp"]

[dev-dependencies]
base64 = "0.22.1"
hkdf = "0.12.4"
hmac = "0.12.1"
sha2 = "0.10.8"
tracing-test = "0.2.5"
