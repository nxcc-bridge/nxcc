[package]
name = "nxcc-vm-base"
version = "0.1.0"
edition = "2024"

[dependencies]
hyper-util = { version = "0.1.11", features = ["tokio"] }
nxcc-interface = { path = "../../interface" }
rcgen = "0.13.2"
thiserror = "2.0.12"
tokio = { version = "1.44.1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-stream = { version = "0.1.17", optional = true }
tokio-vsock = { version = "0.7.0", features = ["tonic012"], optional = true }
tonic = { version = "0.12.3", features = ["tls", "transport"] }
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"

[features]
default = ["uds"]
uds = ["tokio-stream"]
vsock = ["tokio-vsock"]
tcp = []

[dev-dependencies]
http = "1.1.0"
pem = "3.0.5"
rand = "0.8.5"
x509-parser = "0.17.0"
