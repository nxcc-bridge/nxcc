[package]
name = "nxcc-vm-base"
version = "0.1.0"
edition = "2024"

[dependencies]
nxcc-interface = { path = "../../interface" }
thiserror = "1.0.63"
tokio = { version = "1.44.1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-stream = { version = "0.1.17", optional = true }
tokio-vsock = { version = "0.7.0", features = ["tonic012"], optional = true }
tonic = { version = "0.12.3", features = ["transport"] }
tracing = "0.1.41"

[features]
default = ["uds"]
uds = ["tokio-stream"]
vsock = ["tokio-vsock"]

[dev-dependencies]
futures = "0.3.31"
hyper-util = { version = "0.1.11", features = ["tokio"] }
tokio-util = { version = "0.7.11", features = ["io"] }
tower = "0.5.2"
uuid = { version = "1.10.0", features = ["v4"] }
