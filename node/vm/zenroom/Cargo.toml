[package]
name = "nxcc-zenroom-vm"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nxcc-zenroom-vm"
path = "src/main.rs"

[dependencies]
nxcc-vm-base = { path = "../base" }
nxcc-interface = { path = "../../interface" }

async-trait = "0.1.89"
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive", "env"] }
dashmap = "6.1.0"
hex = "0.4.3"
hkdf = "0.12.4"
reqwest = { version = "0.12.23", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "net"] }
tokio-stream = "0.1.18"
tonic = "0.14.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4"] }

[features]
default = ["nxcc-vm-base/uds"]
uds = ["nxcc-vm-base/uds"]
vsock = ["nxcc-vm-base/vsock"]
tcp = ["nxcc-vm-base/tcp"]

[dev-dependencies]
tracing-test = "0.2.5"
