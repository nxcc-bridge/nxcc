syntax = "proto3";

package enclave;


import "google/protobuf/empty.proto";
import "interface.proto";
import "vm.proto"; // For vm.HttpRequest and vm.HttpResponse

// The main secrets service inside the TEE (EnclaveSecrets).
service Secrets {
  // get_report returns a fresh attestation report containing ephemeral pubkey, etc.
  rpc GetReport(GetReportRequest) returns (interface.AttestationReport);

  // put_secrets stores secrets boxes from peers into this enclave.
  rpc PutSecrets(PutSecretsRequest) returns (PutSecretsResponse);

  // get_secrets returns a secrets box encrypted for the requesting enclave.
  rpc GetSecrets(GetSecretsRequest) returns (GetSecretsResponse);

  // check_secrets returns whether the given secrets exist.
  rpc CheckSecrets(CheckSecretsRequest) returns (CheckSecretsResponse);

  // generate_secrets creates secrets for the first time
  rpc GenerateSecrets(GenerateSecretsRequest) returns (google.protobuf.Empty);
}

message GetReportRequest {
  bytes user_data = 1;
}

message PutSecretsRequest {
  repeated SecretsBundle secrets_bundles = 1;
}

message SecretsBundle {
  interface.SecretsBox secrets_box = 1;
  interface.EnvReport env_report = 2;
  interface.ConsumerInfo consumer_info = 3;
}

message PutSecretsResponse {
  bool success = 1;
}

message GetSecretsRequest {
  repeated interface.SecretRequest requests = 1;
  interface.EnvReport requester_env_report = 2;
}

// TODO: Define what proves successful policy execution if needed beyond internal auth store.
message PolicyExecutionReport {
  bytes proof_data = 1; // Placeholder
}

message GetSecretsResponse {
  interface.SecretsBox secrets_box = 1;
}

message CheckSecretsRequest {
  repeated interface.SecretIdentifier ids = 1;
}

message CheckSecretsResponse {
  repeated SecretStatus statuses = 1;
}

message GenerateSecretsRequest {
  repeated interface.SecretRequest requests = 1;
}

message SecretStatus {
  interface.SecretIdentifier id = 1;
  bool found = 2;
  uint64 expiry = 3;
}

// The service responsible for managing and running workers within VMs.
service Runner {
  /// Attaches a running VM instance to this runner service.
  rpc AttachVm (AttachVmRequest) returns (AttachVmResponse);
  /// Detaches a VM instance from this runner service.
  rpc DetachVm (DetachVmRequest) returns (google.protobuf.Empty);

  /// Starts a new worker instance within a specified, attached VM.
  rpc RunWorker (RunWorkerRequest) returns (RunWorkerResponse);

  /// Executes a policy worker against a batch of contexts.
  rpc ExecutePolicy (ExecutePolicyRequest) returns (ExecutePolicyResponse);

  /// Terminates a specific running worker instance.
  rpc TerminateWorker (TerminateWorkerRequest) returns (google.protobuf.Empty);

  /// Delivers a batch of asynchronous events to specified workers.
  rpc DeliverBatchEvents (DeliverBatchEventsRequest) returns (DeliverBatchEventsResponse);

  /// Invokes a worker with an HTTP request.
  rpc InvokeHttpWorker (InvokeHttpWorkerRequest) returns (InvokeHttpWorkerResponse);
}

// --- AttachVm Messages ---

message AttachVmRequest {
  /// A unique identifier assigned by the caller to this VM instance.
  string vm_id = 1;
  /// Connection details for the VM's gRPC service.
  VmAddress address = 2;
}

message VmAddress {
  oneof address_type {
    TcpAddress tcp = 1;
    UdsAddress uds = 2;
    VsockAddress vsock = 3;
  }
}

message TcpAddress {
  string host = 1;
  uint32 port = 2;
}

message UdsAddress {
  string path = 1;
}

message VsockAddress {
  uint32 cid = 1;
  uint32 port = 2;
}

message AttachVmResponse {
  /// Indicates if the VM was successfully attached and the connection established.
  bool attached = 1;
}

// --- DetachVm Messages ---

message DetachVmRequest {
  /// The unique identifier of the VM instance to detach.
  string vm_id = 1;
}

// --- RunWorker Messages ---

message RunWorkerRequest {
  /// The identifier of the attached VM where the worker should run.
  string vm_id = 1;
  /// Serialized WorkerManifest.
  bytes worker_manifest_bytes = 2;
  /// Raw WorkerBundle (DSSE envelope as JSON bytes).
  bytes worker_bundle_bytes = 3;
}

message RunWorkerResponse {
  /// Indicates if the request to run the worker was accepted by the VM.
  bool success = 1;
  /// The unique identifier assigned to the running worker instance by the VM.
  string worker_id = 2;
  /// Optional error message if starting failed.
  string error_message = 3;
}

// --- DeliverBatchEvents Messages ---
message EventDelivery {
  string worker_id = 1; // Target enclave worker ID
  interface.EventPayload event_payload = 2;
  string handler_name = 3; // Name of the handler function in the worker
}

message DeliverBatchEventsRequest {
  repeated EventDelivery events = 1;
}

message DeliverBatchEventsResponse {
  // Optionally, return status for each event or an overall status.
  // For now, simple success/failure for the batch.
  bool success = 1;
  string message = 2;
}

// --- TerminateWorker Messages ---

message TerminateWorkerRequest {
  /// The unique identifier of the worker instance to terminate.
  string worker_id = 1;
}

// --- ExecutePolicy Messages ---

message ExecutePolicyRequest {
  /// The unique identifier of the policy worker instance to invoke.
  string worker_id = 1;
  /// The batch of policy execution contexts to evaluate.
  repeated interface.PolicyExecutionRequest contexts = 2;
}

message ExecutePolicyResponse {
  /// The subset of the requested contexts that satisfied the policy.
  repeated interface.PolicyExecutionRequest satisfied_contexts = 1;
}

// --- InvokeHttpWorker Messages ---

message InvokeHttpWorkerRequest {
  string worker_id = 1; // Enclave's worker_id for the target worker
  vm.HttpRequest request = 2;
}

message InvokeHttpWorkerResponse {
  vm.HttpResponse response = 1;
}
