syntax = "proto3";

package enclave;

import "google/protobuf/empty.proto";
import "interface.proto";

// The main secrets service inside the TEE (EnclaveSecrets).
service EnclaveSecrets {
  // get_report returns a fresh attestation report containing ephemeral pubkey, etc.
  rpc GetReport(GetReportRequest) returns (interface.AttestationReport);

  // put_secrets stores secrets boxes from peers into this enclave.
  rpc PutSecrets(PutSecretsRequest) returns (PutSecretsResponse);

  // get_secrets returns a secrets box encrypted for the requesting enclave.
  // Corrected message name usage here: GetSecretsEnclaveRequest -> GetSecretsResponse
  rpc GetSecrets(GetSecretsEnclaveRequest) returns (GetSecretsResponse);

  // check_secrets returns whether the given secrets exist.
  rpc CheckSecrets(CheckSecretsRequest) returns (CheckSecretsResponse);
}

message GetReportRequest {
  bytes user_data = 1;
}

message PutSecretsRequest {
  repeated SecretsBundle secrets_bundles = 1;
}

message SecretsBundle {
  interface.SecretsBox secrets_box = 1;
  interface.EnvReport env_report = 2;
}

message PutSecretsResponse {
  bool success = 1;
}

// Renamed message to avoid conflict with RPC name
message GetSecretsEnclaveRequest {
  repeated SecretEnclaveRequest requests = 1;
  repeated PolicyExecutionReport policy_reports = 2; // Currently unused by implementation
  interface.EnvReport requester_env_report = 3; // Added field
}

message SecretEnclaveRequest {
  interface.SecretIdentifier id = 1;
}

// This message definition seems incomplete/unused based on current logic
message PolicyExecutionReport {
  // TODO: Define what proves successful policy execution.
  // For now, it's checked via the internal authorization store.
  bytes proof_data = 1; // Placeholder
}

message GetSecretsResponse {
  interface.SecretsBox secrets_box = 1;
}

message CheckSecretsRequest {
  repeated interface.SecretIdentifier ids = 1;
}

message CheckSecretsResponse {
  repeated SecretStatus statuses = 1;
}

message SecretStatus {
  interface.SecretIdentifier id = 1;
  bool found = 2;
  uint64 expiry = 3;
}

service Runner {
  rpc RunWorker (RunWorkerRequest) returns (RunWorkerResponse);
  rpc DeliverEvent (DeliverEventRequest) returns (DeliverEventResponse);
}

message RunWorkerRequest {
  bytes worker_binary = 1;
}

message RunWorkerResponse {
  bool accepted = 1;
}

message DeliverEventRequest {
  string worker_id = 1;
  bytes event_payload = 2;
}

message DeliverEventResponse {
  bool delivered = 1;
}
