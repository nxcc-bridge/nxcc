syntax = "proto3";

package interface;

// Common types shared across daemon/enclave.

message AttestationReport {
  bytes ephemeral_public_key = 1;
  bytes measurement = 2;
  repeated bytes block_hashes = 3;
  bytes user_data = 4;
}

message SecretsBox {
  bytes encrypted_payload = 1;
  bytes sender_public_key = 2;
  string alg = 3;
  repeated SecretIdentifier contained_secret_ids = 4;
}

message SecretIdentifier {
  uint64 chain_id = 1;
  string identity_address = 2;
  string identity_id = 3;
}

// Identifies the code or contract requesting secrets.
message ConsumerInfo {
  bytes bundle_hash = 1;
  bytes signature = 2;
}

message SecretRequest {
  SecretIdentifier secret_id = 1;
  ConsumerInfo consumer = 2;
}

message EnvReport {
  AttestationReport attestation = 1;
  bytes operator_signature = 2;
  string node_id = 3;
}

// For policy runner usage.
message PolicyExecutionRequest {
  repeated SecretIdentifier secret_ids = 1;
  ConsumerInfo consumer = 2;
  EnvReport env_report = 3;
}

message PolicyExecutionReport {
  PolicyExecutionRequest request = 1;
  bool decision = 2;
  uint64 timestamp = 3;
}
