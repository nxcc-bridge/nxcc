syntax = "proto3";

package vm;

import "interface.proto";

/// VmService defines the interface for controlling and interacting with worker
/// instances running within the execution enclave (VM).
service Vm {
  /// Starts a new worker instance based on the provided configuration.
  rpc StartWorker(StartWorkerRequest) returns (StartWorkerResponse);

  /// Stops a specific running worker instance.
  rpc StopWorker(StopWorkerRequest) returns (StopWorkerResponse);

  /// Sends an invocation request (e.g., an event payload) to a specific worker instance.
  rpc InvokeWorker(InvokeWorkerRequest) returns (InvokeWorkerResponse);

  /// Retrieves a remote attestation report from the execution enclave.
  rpc GetAttestation(GetAttestationRequest) returns (GetAttestationResponse);
}

/// Request to start a new worker instance.
message StartWorkerRequest {
  /// An identifier for the type of worker (e.g., hash of code or config name).
  string worker_id = 1;
  /// The worker program code or a reference to it.
  bytes worker_code = 2;
  /// Configuration specific to the worker instance (e.g., environment variables, resource limits).
  /// The format is specific to the VM implementation (e.g., JSON, Cap'n Proto).
  bytes config = 3;
}

/// Response after attempting to start a worker instance.
message StartWorkerResponse {
  /// Unique identifier assigned to the successfully started worker instance.
  string instance_id = 1;
  /// Indicates if the worker was started successfully.
  bool success = 2;
  /// Optional error message if starting failed.
  string error_message = 3;
}

/// Request to stop a specific worker instance.
message StopWorkerRequest {
  /// The unique identifier of the worker instance to stop.
  string instance_id = 1;
}

/// Response after attempting to stop a worker instance.
message StopWorkerResponse {
  /// Indicates if the worker was stopped successfully.
  bool success = 1;
  /// Optional error message if stopping failed.
  string error_message = 2;
}

/// Request to invoke a function or send data to a worker instance.
message InvokeWorkerRequest {
  /// The unique identifier of the worker instance to invoke.
  string instance_id = 1;
  /// The payload/data to send to the worker instance.
  bytes payload = 2;
}

/// Response received after invoking a worker instance.
message InvokeWorkerResponse {
  /// The result or output returned by the worker instance.
  bytes result = 1;
  /// Indicates if the invocation was successful.
  bool success = 2;
  /// Optional error message if invocation failed.
  string error_message = 3;
}

/// Request to get an attestation report from the execution enclave.
message GetAttestationRequest {
  /// Optional user data to be included in the attestation report's quote.
  bytes user_data = 1;
}

/// Response containing the attestation report.
message GetAttestationResponse {
  /// The attestation report generated by the execution enclave.
  interface.AttestationReport report = 1;
}
