syntax = "proto3";

package daemon;

// Daemon notification service.
service Daemon {
  // Broadcast a notification on the p2p network.
  rpc BroadcastNotification (BroadcastRequest) returns (BroadcastResponse);
}

message BroadcastRequest {
  string message = 1;
}

message BroadcastResponse {
  bool success = 1;
}

// Secrets service for debugging and testing.
service Secrets {
  // Retrieve one or more secrets (with attached metadata).
  rpc GetSecrets (GetSecretsRequest) returns (GetSecretsResponse);
}

message SecretIdentifier {
  uint64 chain_id = 1;
  string identity_address = 2;
  string identity_id = 3;
}

message SecretRequest {
  // Hash of the worker that will use the secret
  bytes consumer = 1;
}

message SecretRequesterInfo {
  // The attestation generated by the requester secrets enclave
  bytes report = 1;
  // The public key of the requesting secrets enclave (for key encapsulation)
  bytes public_key = 2;
}

message GetSecretsRequest {
  // Map of secret identifiers to their request details
  map<string, SecretRequestList> secret_requests = 1;
  // Information about the requester for authentication and encryption
  SecretRequesterInfo requester_info = 2;
}

message SecretRequestList {
  SecretIdentifier id = 1;
  repeated SecretRequest requests = 2;
}

message SecretsBox {
  // Include cipher/kem and signature alg
  string alg = 1;
  bytes nonce = 2;
  bytes sender_public_key = 3;
  bytes payload = 4;
  bytes signature = 5;
}

message GetSecretsResponse {
  // Remaining unfulfilled secret requests
  map<string, SecretRequestList> remaining_requests = 1;
  // Encrypted box containing the secrets
  SecretsBox secrets_box = 2;
}

message EncryptedSecret {
  bytes data = 1;
  // Metadata may be large; using bytes to allow binary blobs.
  bytes metadata = 2;
  uint64 chain_id = 3;
  string identity_address = 4;
  string identity_id = 5;
}
