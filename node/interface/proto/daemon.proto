syntax = "proto3";

package daemon;

import "interface.proto";

// Daemon notification service
service Daemon {
  rpc BroadcastNotification (BroadcastRequest) returns (BroadcastResponse);
}

message BroadcastRequest {
  string message = 1;
}

message BroadcastResponse {
  bool success = 1;
}

service Debug {
  rpc AttachVm (AttachVmRequest) returns (AttachVmResponse);
}

message AttachVmRequest {
  string vm_id = 1;
  string uds_path = 2;
}

message AttachVmResponse {
  bool success = 1;
}

message CheckWorkerStatusRequest {
  string work_order_id = 1; // The hash of the work order DSSE envelope
}

message CheckWorkerStatusResponse {
  bool found = 1;
  bool is_running = 2;
  string status_message = 3; // e.g., "Running", "Process exited", "UDS not connectable"
  string worker_id = 4;      // The internal enclave worker ID
  string vm_id = 5;          // The VM it's running on
}

// Work Order service for submitting work orders to the daemon.
service WorkOrder {
  rpc SubmitWorkOrder (SubmitWorkOrderRequest) returns (SubmitWorkOrderResponse);
  rpc CheckWorkerStatus (CheckWorkerStatusRequest) returns (CheckWorkerStatusResponse);
}

message SubmitWorkOrderRequest {
  bytes work_order_dsse_bytes = 1; // Serialized DsseEnvelope (JSON bytes) containing WorkOrderPayload
}

message SubmitWorkOrderResponse {
  string work_order_id = 1; // The unique work order hash
  bool success = 2;
}
