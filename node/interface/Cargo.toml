[package]
name = "nxcc-interface"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-primitives = { version = "1.0.0", features = ["serde"] }
base64 = "0.22.1"
ciborium = "0.2.2"
prost = "0.13.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
url = { version = "2.5.4", features = ["serde"] } # Added for WorkerManifest
tonic = { version = "0.13.1", features = ["transport"] }
alloy-rpc-types = "1.0.6"

[build-dependencies]
tonic-build = "0.13.1"
