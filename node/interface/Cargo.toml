[package]
name = "nxcc-interface"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-primitives = { version = "1.0.0", features = ["serde"] }
ciborium = "0.2.2"
prost = "0.13.5"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10.8"
tonic = { version = "0.12.3", features = ["transport"] }

[build-dependencies]
tonic-build = "0.12.3"
