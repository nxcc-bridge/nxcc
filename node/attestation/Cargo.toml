[package]
name = "nxcc-attestation"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22.1"
log = "0.4"
thiserror = "2.0.15"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["time"] }
nxcc-interface = { path = "../interface" }
