[package]
name = "nxcc-attestation"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2"
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
dcap-qvl = { version = "0.3", features = ["std", "report"] }
base64 = "0.22.1"
log = "0.4"
thiserror = "2.0.15"
libc = "0.2"
tokio = { version = "1.0", features = ["time"] }
nxcc-interface = { path = "../interface" }
x509-parser = "0.16"
ring = "0.17"
der = "0.7"
time = "0.3"
nix = { version = "0.29", features = ["ioctl"] }
scopeguard = "1.2"
tracing = "0.1"
tracing-test = "0.2"
ed25519-dalek = { version = "2.0", features = ["serde"] }
