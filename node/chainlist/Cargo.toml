[package]
name = "nxcc-chainlist"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-primitives = "1.0.0"
alloy-provider = { version = "1.0.6", default-features = false, features = ["reqwest", "reqwest-rustls-tls", "pubsub", "ws"] }
alloy-rpc-types = "1.0.12"
clap = { version = "4.5.40", features = ["derive"] }
eyre = "0.6.12"
futures = "0.3.31"
indicatif = { version = "0.18.0", features = ["tokio"] }
once_cell = "1.19.0"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.15"
tokio = { version = "1.44.1", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.4"

[[bin]]
name = "nxcc-chainlist-gen"
path = "src/bin/main.rs"
