[package]
name = "nxcc-chainlist"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-primitives = "1.5.2"
alloy-provider = { version = "1.5.2", default-features = false, features = ["reqwest", "reqwest-rustls-tls", "pubsub", "ws"] }
alloy-rpc-types = "1.5.2"
clap = { version = "4.5.54", features = ["derive"] }
eyre = "0.6.12"
futures = "0.3.31"
indicatif = { version = "0.18.3", features = ["tokio"] }
once_cell = "1.21.3"
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = "2.5.8"

[[bin]]
name = "nxcc-chainlist-gen"
path = "src/bin/main.rs"
