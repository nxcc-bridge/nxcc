syntax = "proto3";
package secrets;

message GetSecretRequest {
  string chain_id = 1;
  string contract_address = 2;
  string secret_id = 3;
  bytes payload = 4;
}

message EncryptedSecret {
  bytes data = 1;
  string metadata = 2;
}

message GetSecretResponse {
  repeated EncryptedSecret secrets = 1;
}

service Secrets {
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
}
