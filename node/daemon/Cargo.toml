[package]
name = "nxcc-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "env", "test"] }
futures = "0.3.31"
libp2p = { version = "0.56.0", features = ["tokio", "tcp", "noise", "yamux", "mdns", "identify", "macros", "ping", "kad", "gossipsub"] }
prost = "0.14.3"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "signal", "macros", "net", "sync", "time", "fs"] }
tokio-stream = "0.1.18"
tokio-vsock = { version = "0.7.2" }
tonic = { version = "0.14.2", features = ["transport"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
nxcc-interface = { path = "../interface" }
nxcc-chainlist = { path = "../chainlist" }
nxcc-attestation = { path = "../attestation" }
hyper-util = "0.1.19"
ciborium = "0.2.2"
alloy-primitives = "1.5.2"
alloy-provider = { version = "1.5.2", default-features = false, features = ["reqwest", "reqwest-rustls-tls", "pubsub", "ws"] }
alloy-sol-types = { version = "1.5.2", features = ["json"] }
alloy-transport-http = { version = "1.5.2", features = ["reqwest", "reqwest-rustls-tls"], default-features = false }
url = "2.5.8"
alloy-rpc-types = "1.5.2"
alloy-contract = "1.5.2"
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.149"
tempfile = "3.24.0"
base64 = "0.22.1"
sha2 = "0.10.9"
percent-encoding = "2.3.2"
futures-util = "0.3.31"
ed25519-dalek = { version = "2.2", features = ["serde"] }
coset = "0.4"
axum = "0.8.8"
tower-http = { version = "0.6.8", features = ["cors"] }
tower = "0.5.3"

[dev-dependencies]
tracing-test = "0.2.5"
tower = { version = "0.5.3", features = ["util"] }
serde_urlencoded = "0.7.1"
anyhow = "1.0.100"
