[package]
name = "nxcc-platform-enclave"
version = "0.1.0"
edition = "2024"

[dependencies]
nxcc-interface = { path = "../interface" }
nxcc-vm-base = { path = "../vm/base" }
tokio = { version = "1.44.1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
tokio-vsock = { version = "0.7.0", features = ["tonic013"], optional = true }
tonic = { version = "0.13.1", features = ["transport", "tls-aws-lc"] }
tracing = "0.1.41"
tokio-stream = { version = "0.1.17", optional = true }
serde = { version = "1.0", features = ["derive"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
x25519-dalek = { version = "2.0.1", features = ["getrandom", "static_secrets"] }
aes-gcm-siv = { version = "0.11.1", features = ["std"] }
sha2 = "0.10.8"
hex = "0.4.3"
ciborium = "0.2.2"
once_cell = "1.19.0"
chrono = { version = "0.4.38", default-features = false, features = ["clock"] } # For expiry check
thiserror = "2.0.12"
zeroize = "1.8.1"
rand = "0.8.5"
clap = { version = "4.5", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
serde_json = "1.0.140"

[features]
default = ["uds"]
uds = ["tokio-stream", "nxcc-vm-base/uds"]
vsock = ["tokio-vsock", "nxcc-vm-base/vsock"]

[dev-dependencies]
alloy-primitives = { version = "1.0.0", features = ["rand"] }
base64 = "0.22.1"
nxcc-vm-base = { path = "../vm/base", features = ["test"] }
tempfile = "3.19.1"
tracing-test = "0.2.5"
