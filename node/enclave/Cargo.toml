[package]
name = "nxcc-platform-enclave"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3"
nxcc-interface = { path = "../interface" }
tokio = { version = "1.44.1", features = ["rt-multi-thread", "macros", "net"] }
tokio-vsock = { version = "0.7.0", features = ["tonic012"] }
tonic = { version = "0.12.3", features = ["transport"] }
tracing = "0.1.41"
tokio-stream = "0.1.17"
serde = { version = "1.0", features = ["derive"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
x25519-dalek = { version = "2.0.1", features = ["getrandom", "static_secrets"] }
ed25519-dalek = { version = "2.1.0", features = ["rand_core", "serde"] }
rand_core = "0.6" # Pinned for ed25519-dalek v2 compatibility
aes-gcm-siv = { version = "0.11.1", features = ["std"] }
sha2 = "0.10.8"
hex = "0.4.3"
ciborium = "0.2.2"
once_cell = "1.19.0"
chrono = { version = "0.4.38", default-features = false, features = ["clock"] } # For expiry check
thiserror = "1.0.63" # For crypto errors
zeroize = "1.8.1"

[dev-dependencies]
alloy-primitives = { version = "1.0.0", features = ["rand"] }
rand = "0.8" # For testing key generation
