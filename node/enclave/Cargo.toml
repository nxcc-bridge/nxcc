[package]
name = "nxcc-platform-enclave"
version = "0.1.0"
edition = "2024"

[dependencies]
nxcc-interface = { path = "../interface" }
nxcc-vm-base = { path = "../vm/base" }
nxcc-attestation = { path = "../attestation" }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
tokio-vsock = { version = "0.7.2", optional = true }
tonic = { version = "0.14.2", features = ["transport", "tls-aws-lc"] }
tracing = "0.1.44"
tokio-stream = { version = "0.1.18", optional = true }
serde = { version = "1.0", features = ["derive"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
x25519-dalek = { version = "2.0.1", features = ["getrandom", "static_secrets"] }
aes-gcm-siv = { version = "0.11.1", features = ["std"] }
sha2 = "0.10.9"
hex = "0.4.3"
ciborium = "0.2.2"
once_cell = "1.21.3"
chrono = { version = "0.4.43", default-features = false, features = ["clock"] } # For expiry check
thiserror = "2.0.18"
zeroize = "1.8.2"
rand = "0.9.2"
clap = { version = "4.5", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
serde_json = "1.0.149"
futures = "0.3"
anyhow = "1.0"
async-trait = "0.1"

[features]
default = ["uds"]
uds = ["tokio-stream", "nxcc-vm-base/uds"]
vsock = ["tokio-vsock", "nxcc-vm-base/vsock"]

[dev-dependencies]
alloy-primitives = { version = "1.5.2", features = ["rand"] }
base64 = "0.22.1"
nxcc-vm-base = { path = "../vm/base", features = ["test"] }
tempfile = "3.24.0"
tracing-test = "0.2.5"
