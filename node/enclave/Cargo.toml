[package]
name = "enclave"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3"
interface = { path = "../interface" }
tokio = { version = "1.44.1", features = ["rt-multi-thread", "macros", "net"] }
tokio-vsock = { version = "0.7.0", features = ["tonic012"] }
tonic = { version = "0.12.3", features = ["transport"] }
tracing = "0.1.41"
tokio-stream = "0.1.17"
serde = { version = "1.0", features = ["derive"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
aes-gcm = { version = "0.10.3", features = ["std", "zeroize"] }
x25519-dalek = { version = "2.0.1", features = ["getrandom"] }
ed25519-dalek = { version = "2.0.5", features = ["rand_core"] }
rand = "0.9.0"
rand_core = "0.9.3"
rand_core_0_6 = { package = "rand_core", version = "0.6" }
hex = "0.4.3"
ciborium = "0.2.2"
